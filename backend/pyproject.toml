[project]
name = "bellwether"
version = "0.1.0"
description = "Mireye x Houston 311 water-main-failure agent"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai-agents>=0.1.0",
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "typer>=0.12.0",
    "osmium>=4.3.1",
]

[project.scripts]
bellwether = "bellwether.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["bellwether"]
